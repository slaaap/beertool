version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin:*", "org.jetbrains.kotlin.*"]
      ktor:
        patterns: ["io.ktor*"]
      exposed:
        patterns: ["org.jetbrains.exposed*"]
      flyway:
        patterns: ["org.flywaydb*"]
      kotlinx-serialization:
        patterns: ["org.jetbrains.kotlinx:kotlinx-serialization*"]
      testing:
        patterns: ["org.junit*", "io.kotest*", "org.testcontainers*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
